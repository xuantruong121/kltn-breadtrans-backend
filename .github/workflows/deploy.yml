name: CD — Deploy to Oracle VPS

on:
  push:
    branches: [ "main" ]

concurrency:
  group: deploy-production
  cancel-in-progress: false   # Không cancel deploy đang chạy

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/breadtrans
            bash scripts/deploy.sh

      - name: Health Check
        run: |
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.DOMAIN }}/api/health)
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed! HTTP status: $STATUS"
            exit 1
          fi
          echo "✅ Health check passed! API is live."
