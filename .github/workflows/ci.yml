name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: kltn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run Linter
      run: npm run lint

    - name: Build project
      run: npm run build

    - name: Push Database Schema
      env:
        DATABASE_URL: "postgresql://postgres:password@localhost:5432/kltn_test?schema=public"
      run: npx prisma db push

    - name: Run Unit Tests
      run: npm run test

    - name: Run E2E Tests
      env:
        DATABASE_URL: "postgresql://postgres:password@localhost:5432/kltn_test?schema=public"
      run: npm run test:e2e
