name: Backend CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Backend CI / quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kltn_test_db
        # Host ports differ from the local protected ones (5432/5433, Redis
        # 6379), which the P0 test-target guard refuses by design.
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kltn_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      CI: 'true'
      CI_DATABASE_IS_EPHEMERAL: 'true'
      PRODUCTION_DATABASE_NOT_USED: 'true'
      LOCAL_OWNER_DATABASE_NOT_USED: 'true'
      DATABASE_URL: postgresql://postgres:postgres@localhost:55432/kltn_test_db?schema=public
      REDIS_URL: redis://localhost:6380
      JWT_SECRET: ci-only-jwt-secret
      JWT_REFRESH_SECRET: ci-only-refresh-secret
      OTP_SECRET: ci-only-otp-secret
      MOCK_AZURE_SPEECH: 'true'
      MOCK_GEMINI: 'true'
      MOCK_OPENAI: 'true'
      MOCK_R2: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations to ephemeral database
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit and integration tests
        run: npm test -- --ci --runInBand

      - name: E2E tests
        # E2E boots the whole app and requires verified disposable targets.
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:55432/kltn_test_db?schema=public
          TEST_REDIS_URL: redis://localhost:6380
        run: npm run test:e2e

      - name: Upload Jest diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-output
          path: |
            coverage
            test-results
          if-no-files-found: ignore
