services:
  # Real local development database. Its volume holds the only live data —
  # never point a disposable tool (such as Prisma's --shadow-database-url)
  # at this service. See docs/database-safety.md.
  postgres:
    image: postgres:15-alpine
    container_name: kltn-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kltn_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # `always`, not `unless-stopped`: Docker Desktop marks containers as
    # manually stopped when it shuts down, and `unless-stopped` then declines
    # to start them on the next boot. The backup worker is useless without
    # this service, so it must come back on its own.
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d kltn_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # Disposable database Prisma may reset/replay freely when generating
  # migrations. Separate container, separate volume, separate port — so a
  # shadow reset can never reach development data.
  postgres-shadow:
    image: postgres:15-alpine
    container_name: kltn-postgres-shadow
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kltn_shadow
    ports:
      - '5433:5432'
    volumes:
      - postgres_shadow_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d kltn_shadow']
      interval: 10s
      timeout: 5s
      retries: 5

  # Scheduled logical backups (pg_dump -Fc) of the development database,
  # written to a host directory outside the Postgres data volume.
  postgres-backup:
    image: postgres:15-alpine
    container_name: kltn-postgres-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: password
      PGDATABASE: kltn_db
      # One backup a day at 00:00 Vietnam time (owner 2026-11-16); a machine
      # that was off at midnight gets it as soon as Docker starts.
      BACKUP_AT: '00:00'
      BACKUP_UTC_OFFSET_MINUTES: '420'
      BACKUP_RETENTION_DAYS: '14'
      # Weekly restore drill into the throwaway postgres-drill service.
      DRILL_PGHOST: postgres-drill
      DRILL_PGUSER: postgres
      DRILL_PGPASSWORD: drill
      RESTORE_DRILL_AT: '04:00'
      RESTORE_DRILL_WEEKDAY: '0'
      # `depends_on` is not re-evaluated when the Docker daemon restarts this
      # container under its restart policy, so it can start while Postgres is
      # still recovering. The worker waits instead of losing the whole cycle.
      POSTGRES_READY_RETRY_SECONDS: '30'
      POSTGRES_READY_MAX_ATTEMPTS: '20'
      # A failed cycle retries on this short window, never the full interval.
      BACKUP_FAILURE_RETRY_SECONDS: '300'
    volumes:
      - ./docker/postgres-backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./docker/postgres-backup/restore-drill.sh:/usr/local/bin/restore-drill.sh:ro
      - ${POSTGRES_BACKUP_DIR:-./db-backups}:/backups
    # The backup loop stays PID 1 (the healthcheck and restart policy follow
    # it); the weekly restore drill runs beside it.
    entrypoint:
      [
        '/bin/sh',
        '-c',
        '/bin/sh /usr/local/bin/restore-drill.sh --loop & exec /bin/sh /usr/local/bin/backup.sh',
      ]
    restart: always
    # The scheduler loop is PID 1, so a fatal exit already stops the container
    # and the restart policy takes over. This only catches the failure mode that
    # leaves the loop alive but unable to do its job: the host bind mount going
    # away, which would otherwise fail silently every cycle.
    healthcheck:
      test:
        ['CMD-SHELL', 'pgrep -f backup.sh >/dev/null && [ -w /backups ]']
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

  # Throwaway server for the restore drill: data on tmpfs, no published port,
  # its own cluster (the drill refuses to run if it ever matched kltn_db's).
  postgres-drill:
    image: postgres:15-alpine
    container_name: kltn-postgres-drill
    environment:
      POSTGRES_PASSWORD: drill
    tmpfs:
      - /var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kltn-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: always
    command: redis-server --save 60 1 --loglevel warning

volumes:
  postgres_data:
  postgres_shadow_data:
  redis_data:
