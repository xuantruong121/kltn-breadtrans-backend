services:
  # Real local development database. Its volume holds the only live data —
  # never point a disposable tool (such as Prisma's --shadow-database-url)
  # at this service. See docs/database-safety.md.
  postgres:
    image: postgres:15-alpine
    container_name: kltn-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kltn_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d kltn_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # Disposable database Prisma may reset/replay freely when generating
  # migrations. Separate container, separate volume, separate port — so a
  # shadow reset can never reach development data.
  postgres-shadow:
    image: postgres:15-alpine
    container_name: kltn-postgres-shadow
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kltn_shadow
    ports:
      - '5433:5432'
    volumes:
      - postgres_shadow_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d kltn_shadow']
      interval: 10s
      timeout: 5s
      retries: 5

  # Scheduled logical backups (pg_dump -Fc) of the development database,
  # written to a host directory outside the Postgres data volume.
  postgres-backup:
    image: postgres:15-alpine
    container_name: kltn-postgres-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: password
      PGDATABASE: kltn_db
      BACKUP_INTERVAL_SECONDS: '21600' # every 6 hours
      BACKUP_RETENTION_DAYS: '14'
      # `depends_on` is not re-evaluated when the Docker daemon restarts this
      # container under its restart policy, so it can start while Postgres is
      # still recovering. The worker waits instead of losing the whole cycle.
      POSTGRES_READY_RETRY_SECONDS: '30'
      POSTGRES_READY_MAX_ATTEMPTS: '20'
      # A failed cycle retries on this short window, never the full interval.
      BACKUP_FAILURE_RETRY_SECONDS: '300'
    volumes:
      - ./docker/postgres-backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ${POSTGRES_BACKUP_DIR:-./db-backups}:/backups
    entrypoint: ['/bin/sh', '/usr/local/bin/backup.sh']
    restart: unless-stopped
    # The scheduler loop is PID 1, so a fatal exit already stops the container
    # and the restart policy takes over. This only catches the failure mode that
    # leaves the loop alive but unable to do its job: the host bind mount going
    # away, which would otherwise fail silently every cycle.
    healthcheck:
      test:
        ['CMD-SHELL', 'pgrep -f backup.sh >/dev/null && [ -w /backups ]']
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: kltn-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

volumes:
  postgres_data:
  postgres_shadow_data:
  redis_data:
