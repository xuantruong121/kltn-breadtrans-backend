services:
  minio-speaking:
    image: minio/minio:latest
    container_name: breadtrans-speaking-minio
    environment:
      MINIO_ROOT_USER: breadtrans_local_access
      MINIO_ROOT_PASSWORD: breadtrans_local_secret_2026
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - breadtrans-speaking-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio-speaking-init:
    image: minio/mc:latest
    container_name: breadtrans-speaking-minio-init
    depends_on:
      minio-speaking:
        condition: service_healthy
    environment:
      MC_HOST_local: http://breadtrans_local_access:breadtrans_local_secret_2026@minio-speaking:9000
    volumes:
      - ./docker/minio/speaking-cors.json:/speaking-cors.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc mb --ignore-existing local/breadtrans-speaking-local &&
      mc cors set local/breadtrans-speaking-local /speaking-cors.json"

volumes:
  breadtrans-speaking-minio-data:
