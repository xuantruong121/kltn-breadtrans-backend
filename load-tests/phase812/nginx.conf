events {}

http {
  log_format phase8122 '$remote_addr "$request" $status upstream=$upstream_addr upstream_status=$upstream_status request_time=$request_time upstream_time=$upstream_response_time';
  access_log /dev/stdout phase8122;

  upstream phase8122_backend {
    server host.docker.internal:3101;
    server host.docker.internal:3102;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://phase8122_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      add_header X-Phase8122-Upstream $upstream_addr always;
    }
  }
}
