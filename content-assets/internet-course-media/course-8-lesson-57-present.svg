<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Present Simple and Present Continuous</title>
  <desc id="desc">An original BreadTrans comparison of routines and actions happening now.</desc>
  <rect width="1200" height="650" rx="36" fill="#f8fafc"/>
  <rect x="38" y="38" width="1124" height="574" rx="28" fill="#ffffff" stroke="#dbe4f0" stroke-width="4"/>
  <text x="600" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Two ways to talk about the present</text>
  <line x1="600" y1="135" x2="600" y2="550" stroke="#e2e8f0" stroke-width="3"/>
  <rect x="78" y="150" width="474" height="350" rx="24" fill="#eff6ff" stroke="#60a5fa" stroke-width="4"/>
  <rect x="648" y="150" width="474" height="350" rx="24" fill="#ecfdf5" stroke="#34d399" stroke-width="4"/>
  <text x="112" y="205" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1d4ed8">PRESENT SIMPLE</text>
  <text x="682" y="205" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#047857">PRESENT CONTINUOUS</text>
  <circle cx="184" cy="286" r="62" fill="#ffffff" stroke="#2563eb" stroke-width="8"/>
  <path d="M184 286V245M184 286l30 18" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <circle cx="886" cy="286" r="62" fill="#ffffff" stroke="#059669" stroke-width="8"/>
  <circle cx="886" cy="286" r="22" fill="#10b981"/>
  <path d="M886 214v-18M886 358v18M814 286h-18M958 286h18" stroke="#059669" stroke-width="8" stroke-linecap="round"/>
  <text x="282" y="256" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">habit / routine</text>
  <text x="282" y="292" font-family="Arial, sans-serif" font-size="22" fill="#334155">every day · usually · often</text>
  <text x="982" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#065f46">happening now</text>
  <text x="982" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#334155">now · at the moment · today</text>
  <rect x="112" y="386" width="406" height="78" rx="16" fill="#dbeafe"/>
  <rect x="682" y="386" width="406" height="78" rx="16" fill="#d1fae5"/>
  <text x="132" y="425" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e40af">She drinks coffee every morning.</text>
  <text x="702" y="425" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#047857">She is drinking coffee now.</text>
  <text x="600" y="572" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#64748b">Choose the tense that matches the time and situation.</text>
</svg>
