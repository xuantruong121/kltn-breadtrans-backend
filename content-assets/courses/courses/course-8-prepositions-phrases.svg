<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Giới từ và cụm từ thông dụng</title><desc id="desc">Sơ đồ trực quan cho giới từ vị trí in, on, under và next to.</desc>
  <rect width="1200" height="675" rx="28" fill="#f8fafc"/><text x="76" y="95" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#334155">PREPOSITIONS IN SPACE</text><text x="78" y="139" font-family="Arial,sans-serif" font-size="23" fill="#475569">Quan sát vị trí của vật trước khi chọn giới từ</text>
  <g transform="translate(90 200)"><rect width="235" height="170" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="24" y="44" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#2563eb">IN</text><rect x="78" y="68" width="90" height="75" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="4"/><circle cx="123" cy="105" r="22" fill="#f97316"/></g>
  <g transform="translate(350 200)"><rect width="235" height="170" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="24" y="44" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#2563eb">ON</text><rect x="78" y="95" width="90" height="50" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="4"/><circle cx="123" cy="75" r="22" fill="#f97316"/></g>
  <g transform="translate(610 200)"><rect width="235" height="170" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="24" y="44" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#2563eb">UNDER</text><rect x="78" y="82" width="90" height="50" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="4"/><circle cx="123" cy="145" r="22" fill="#f97316"/></g>
  <g transform="translate(870 200)"><rect width="235" height="170" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="24" y="44" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#2563eb">NEXT TO</text><rect x="78" y="82" width="90" height="50" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="4"/><circle cx="48" cy="107" r="22" fill="#f97316"/></g>
  <rect x="150" y="465" width="900" height="70" rx="16" fill="#e0f2fe"/><text x="220" y="510" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#075985">at home · on time · interested in · good at</text>
</svg>
