<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">So sánh hiện tại đơn và hiện tại tiếp diễn</title>
  <desc id="desc">Infographic hai cột đối chiếu thói quen lặp lại với hành động đang xảy ra, gồm mốc thời gian, ví dụ và công thức.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f7fdfb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#17304d" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1440" height="760" rx="34" fill="url(#bg)"/>
  <rect x="52" y="42" width="1336" height="112" rx="24" fill="#0f1f3d"/>
  <circle cx="108" cy="98" r="30" fill="#7c3aed"/>
  <path d="M97 98h22M108 87v22" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <text x="158" y="88" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800" fill="#fff">CHỌN THÌ THEO NGỮ CẢNH</text>
  <text x="158" y="122" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">Một bên nói về điều thường xảy ra — một bên nói về điều đang diễn ra ngay lúc này.</text>
  <rect x="52" y="184" width="648" height="524" rx="28" fill="#fff" stroke="#bfdbfe" stroke-width="4" filter="url(#shadow)"/>
  <rect x="740" y="184" width="648" height="524" rx="28" fill="#fff" stroke="#a7f3d0" stroke-width="4" filter="url(#shadow)"/>
  <rect x="84" y="216" width="210" height="38" rx="19" fill="#dbeafe"/>
  <text x="105" y="242" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800" fill="#1d4ed8">PRESENT SIMPLE</text>
  <text x="84" y="292" font-family="Inter,Arial,sans-serif" font-size="21" fill="#334155">Thói quen · sự thật · lịch cố định</text>
  <circle cx="146" cy="380" r="65" fill="#eff6ff" stroke="#2563eb" stroke-width="8"/>
  <path d="M146 334v49l32 21M146 380h-31" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <text x="248" y="352" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="800" fill="#0f172a">DẤU HIỆU</text>
  <text x="248" y="388" font-family="Inter,Arial,sans-serif" font-size="21" fill="#1e3a8a">every day · usually · often</text>
  <text x="84" y="482" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">She drinks coffee every morning.</text>
  <rect x="84" y="526" width="584" height="112" rx="18" fill="#eff6ff"/>
  <text x="112" y="566" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="2" fill="#1d4ed8">CẤU TRÚC</text>
  <text x="112" y="610" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="800" fill="#1e40af">S + V / V-s</text>
  <rect x="772" y="216" width="270" height="38" rx="19" fill="#d1fae5"/>
  <text x="794" y="242" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800" fill="#047857">PRESENT CONTINUOUS</text>
  <text x="772" y="292" font-family="Inter,Arial,sans-serif" font-size="21" fill="#334155">Đang xảy ra · tạm thời · hôm nay</text>
  <circle cx="836" cy="380" r="65" fill="#ecfdf5" stroke="#059669" stroke-width="8"/>
  <circle cx="836" cy="380" r="22" fill="#10b981"/>
  <path d="M836 306v-22M836 454v22M762 380h-22M910 380h22" stroke="#059669" stroke-width="8" stroke-linecap="round"/>
  <text x="938" y="352" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="800" fill="#0f172a">DẤU HIỆU</text>
  <text x="938" y="388" font-family="Inter,Arial,sans-serif" font-size="21" fill="#065f46">now · at the moment · today</text>
  <text x="772" y="482" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">She is drinking coffee now.</text>
  <rect x="772" y="526" width="584" height="112" rx="18" fill="#ecfdf5"/>
  <text x="800" y="566" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="2" fill="#047857">CẤU TRÚC</text>
  <text x="800" y="610" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="800" fill="#047857">am / is / are + V-ing</text>
</svg>
