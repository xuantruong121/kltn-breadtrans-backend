<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Động từ khuyết thiếu cơ bản</title><desc id="desc">Thang ý nghĩa từ khả năng đến lời khuyên và nghĩa vụ cho can, should và must.</desc>
  <rect width="1200" height="675" rx="28" fill="#f0fdf4"/><text x="76" y="96" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#047857">MODAL VERBS</text><text x="78" y="140" font-family="Arial,sans-serif" font-size="23" fill="#475569">Chọn modal verb theo mức độ và ngữ cảnh</text>
  <line x1="160" y1="520" x2="1040" y2="520" stroke="#94a3b8" stroke-width="5"/><path d="M1040 500l30 20-30 20" fill="none" stroke="#94a3b8" stroke-width="5"/><rect x="180" y="400" width="210" height="120" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/><rect x="475" y="320" width="210" height="200" rx="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/><rect x="770" y="235" width="210" height="285" rx="20" fill="#fee2e2" stroke="#f87171" stroke-width="3"/><text x="266" y="455" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#1d4ed8">CAN</text><text x="536" y="385" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#b45309">SHOULD</text><text x="842" y="300" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#b91c1c">MUST</text><text x="224" y="492" font-family="Arial,sans-serif" font-size="21" fill="#1e3a8a">ability · permission</text><text x="505" y="475" font-family="Arial,sans-serif" font-size="21" fill="#92400e">advice</text><text x="797" y="470" font-family="Arial,sans-serif" font-size="21" fill="#991b1b">obligation</text><rect x="250" y="180" width="700" height="58" rx="14" fill="#dcfce7"/><text x="302" y="219" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#047857">modal verb + base verb: can speak · should rest · must leave</text>
</svg>
