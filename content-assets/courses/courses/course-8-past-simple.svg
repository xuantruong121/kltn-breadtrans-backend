<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Thì quá khứ đơn</title><desc id="desc">Dòng thời gian cho hành động đã hoàn thành với dấu hiệu thời gian và cấu trúc did.</desc>
  <rect width="1200" height="675" rx="28" fill="#f8f5ff"/><text x="76" y="100" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#6d28d9">PAST SIMPLE</text><text x="78" y="143" font-family="Arial,sans-serif" font-size="23" fill="#475569">Một hành động đã bắt đầu và kết thúc trong quá khứ</text>
  <line x1="130" y1="300" x2="1060" y2="300" stroke="#7c3aed" stroke-width="8" stroke-linecap="round"/><path d="M1050 280l30 20-30 20" fill="none" stroke="#7c3aed" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="270" cy="300" r="22" fill="#fff" stroke="#7c3aed" stroke-width="7"/><circle cx="570" cy="300" r="22" fill="#fff" stroke="#7c3aed" stroke-width="7"/><circle cx="870" cy="300" r="22" fill="#fff" stroke="#7c3aed" stroke-width="7"/><text x="220" y="245" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#5b21b6">yesterday</text><text x="500" y="245" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#5b21b6">last Sunday</text><text x="824" y="245" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#5b21b6">two days ago</text><text x="180" y="370" font-family="Arial,sans-serif" font-size="25" fill="#334155">visited</text><text x="500" y="370" font-family="Arial,sans-serif" font-size="25" fill="#334155">went</text><text x="830" y="370" font-family="Arial,sans-serif" font-size="25" fill="#334155">finished</text>
  <rect x="112" y="458" width="976" height="90" rx="18" fill="#ede9fe"/><text x="160" y="515" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#5b21b6">Statement: V-ed / V2</text><text x="650" y="515" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#5b21b6">Question: Did + S + V?</text>
