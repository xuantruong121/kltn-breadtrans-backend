<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Danh từ, mạo từ và số lượng</title><desc id="desc">Sơ đồ phân biệt vật đếm được, vật không đếm được và từ chỉ lượng.</desc>
  <rect width="1200" height="675" rx="28" fill="#fffaf5"/><text x="70" y="94" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#9a3412">NOUNS · ARTICLES · QUANTITY</text><line x1="70" y1="125" x2="1130" y2="125" stroke="#fed7aa" stroke-width="3"/>
  <rect x="70" y="165" width="500" height="420" rx="24" fill="#fff" stroke="#fdba74" stroke-width="3"/><rect x="630" y="165" width="500" height="420" rx="24" fill="#fff" stroke="#86efac" stroke-width="3"/>
  <text x="108" y="220" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#c2410c">COUNTABLE</text><text x="108" y="258" font-family="Arial,sans-serif" font-size="21" fill="#475569">one / two / many</text><circle cx="170" cy="354" r="38" fill="#fb923c"/><circle cx="270" cy="354" r="38" fill="#f97316"/><circle cx="370" cy="354" r="38" fill="#ea580c"/><text x="108" y="456" font-family="Arial,sans-serif" font-size="26" fill="#7c2d12">a/an · many · a lot of</text><rect x="108" y="488" width="390" height="60" rx="14" fill="#ffedd5"/><text x="130" y="528" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#9a3412">an apple · many books</text>
  <text x="668" y="220" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#047857">UNCOUNTABLE</text><text x="668" y="258" font-family="Arial,sans-serif" font-size="21" fill="#475569">a mass or idea, not individual units</text><path d="M790 319c0-28 24-48 53-48s53 20 53 48v93H790z" fill="#93c5fd" stroke="#2563eb" stroke-width="4"/><path d="M806 323h74" stroke="#1d4ed8" stroke-width="5"/><text x="668" y="456" font-family="Arial,sans-serif" font-size="26" fill="#065f46">much · some · a bottle of</text><rect x="668" y="488" width="390" height="60" rx="14" fill="#dcfce7"/><text x="690" y="528" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#047857">some water · much time</text>
</svg>
