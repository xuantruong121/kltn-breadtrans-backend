<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Will và be going to</title><desc id="desc">Sơ đồ phân biệt quyết định ngay lúc nói với kế hoạch đã có.</desc>
  <rect width="1200" height="675" rx="28" fill="#f0f9ff"/><text x="75" y="96" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#0369a1">FUTURE CHOICES</text><text x="77" y="140" font-family="Arial,sans-serif" font-size="23" fill="#475569">Hai cách nói về tương lai, khác nhau ở ý định và bằng chứng</text>
  <rect x="74" y="188" width="500" height="370" rx="24" fill="#fff" stroke="#38bdf8" stroke-width="3"/><rect x="626" y="188" width="500" height="370" rx="24" fill="#fff" stroke="#818cf8" stroke-width="3"/><text x="112" y="246" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#0284c7">WILL</text><text x="664" y="246" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#4f46e5">BE GOING TO</text>
  <circle cx="170" cy="342" r="54" fill="#e0f2fe"/><path d="M170 313v38l27 17" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/><text x="250" y="334" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0c4a6e">decision now</text><text x="250" y="370" font-family="Arial,sans-serif" font-size="22" fill="#475569">I will help you.</text><rect x="112" y="445" width="390" height="62" rx="14" fill="#e0f2fe"/><text x="140" y="485" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0369a1">will + V</text>
  <path d="M730 385l54-92 54 92z" fill="#c7d2fe" stroke="#4f46e5" stroke-width="5"/><circle cx="784" cy="368" r="14" fill="#4f46e5"/><text x="850" y="334" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#312e81">plan / evidence</text><text x="850" y="370" font-family="Arial,sans-serif" font-size="22" fill="#475569">We are going to visit.</text><rect x="664" y="445" width="390" height="62" rx="14" fill="#e0e7ff"/><text x="692" y="485" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#4338ca">am/is/are going to + V</text>
</svg>
