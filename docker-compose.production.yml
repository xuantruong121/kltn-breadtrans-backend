name: breadtrans-production

services:
  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: breadtrans-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_test_pw}
      POSTGRES_DB: ${POSTGRES_DB:-breadtrans_test}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    # Không expose ra ngoài host — chỉ API mới connect được
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-breadtrans_test}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: breadtrans-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_test_pw}
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_test_pw}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── NestJS API ───────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: breadtrans-api
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_test_pw}@postgres:5432/${POSTGRES_DB:-breadtrans_test}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_test_pw}
      SPEAKING_PIPELINE_MODE: ${SPEAKING_PIPELINE_MODE:-bullmq}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - web
    # Không expose ra internet trực tiếp — Caddy làm reverse proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── Speaking Worker (BullMQ Consumer) ─────────────────────────────────────────
  speaking-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: breadtrans-speaking-worker
    command: ["node", "dist/src/worker/speaking-worker.main.js"]
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_test_pw}@postgres:5432/${POSTGRES_DB:-breadtrans_test}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_test_pw}
      SPEAKING_PIPELINE_MODE: bullmq
      SPEAKING_WORKER_CONCURRENCY: ${SPEAKING_WORKER_CONCURRENCY:-1}
      SPEAKING_WORKER_RATE_LIMIT_MAX: ${SPEAKING_WORKER_RATE_LIMIT_MAX:-1}
      SPEAKING_WORKER_RATE_LIMIT_DURATION_MS: ${SPEAKING_WORKER_RATE_LIMIT_DURATION_MS:-1000}
      SPEAKING_JOB_TIMEOUT_MS: ${SPEAKING_JOB_TIMEOUT_MS:-20000}
      MOCK_AZURE_SPEECH: ${MOCK_AZURE_SPEECH:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - web # outbound Azure Speech and Cloudflare R2
    # Functional liveness check: verifies worker Node event loop is actively updating heartbeat
    healthcheck:
      test: ["CMD", "node", "dist/src/worker/speaking-worker-healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Caddy (Reverse Proxy + Auto HTTPS) ──────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: breadtrans-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      - api

networks:
  internal:
    driver: bridge
    internal: true    # Isolated — không ra internet trực tiếp
  web:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
